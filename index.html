<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM Science Bowl Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&family=Special+Elite&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#F3ECD6;
    --board-shadow:#CBBF9C;
    --ink:#241F14;
    --ink-soft:#5B5646;
    --pencil:#4E5A52;
    --red:#B23A2E;
    --green:#3E6B4A;
    --blue:#2C5578;
    --gold:#B9862C;
    --bio:#B9E4A4;
    --chem:#F7C08A;
    --phys:#A9CDEF;
    --earth:#A9E0D6;
    --energy:#F6D06B;
    --math:#F0AFC7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.05), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(255,255,255,0.04), transparent 45%),
      #3A4A3C;
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    justify-content:center;
    padding:34px 14px 60px;
    min-height:100vh;
  }
  .console{
    width:100%;
    max-width:560px;
    position:relative;
    padding-top:20px;
  }
  .console.device-phone{max-width:380px;}
  .console.device-tablet{max-width:540px;}
  .console.device-desktop{max-width:760px;}

  .clip{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:118px; height:32px;
    background:linear-gradient(180deg,#EFEDE7,#B9B4AC 55%,#8E897F);
    border-radius:5px;
    box-shadow:0 3px 5px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.65);
    z-index:5;
  }
  .clip::before{
    content:'';
    position:absolute; left:10px; right:10px; top:50%; height:2px;
    background:rgba(0,0,0,0.18);
  }
  .clip::after{
    content:'';
    position:absolute; width:6px;height:6px;border-radius:50%;
    background:#6C675F; left:16px; top:5px;
    box-shadow:86px 0 0 #6C675F;
  }

  .paper-sheet{
    background:var(--board);
    border-radius:3px;
    padding:34px 24px 24px;
    padding-left:44px;
    position:relative;
    transform:rotate(-0.35deg);
    box-shadow:0 14px 26px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.4) inset;
  }
  .paper-sheet::before{
    content:'';
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(var(--board) 0 29px, var(--board-shadow) 29px 30px);
    opacity:0.55;
    border-radius:3px;
    pointer-events:none;
  }
  .paper-sheet::after{
    content:'';
    position:absolute; left:34px; top:0; bottom:0; width:1px;
    background:rgba(178,58,46,0.4);
  }
  .paper-sheet > *{ position:relative; z-index:1; }

  .team-tag{
    position:absolute; top:10px; right:14px;
    font-family:'Special Elite', monospace;
    font-size:10px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    border:1px solid var(--ink-soft);
    padding:2px 8px;
    border-radius:2px;
    transform:rotate(2deg);
    background:rgba(255,255,255,0.5);
    z-index:2;
  }

  .eyebrow{
    font-family:'Special Elite', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px 0;
  }
  .title-hand{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:40px;
    line-height:0.95;
    margin:0 0 4px 0;
    color:var(--ink);
  }
  .console.device-phone .title-hand{font-size:30px;}
  .console.device-desktop .title-hand{font-size:52px;}

  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:12px;
    padding-bottom:12px;
    border-bottom:2px solid var(--ink);
  }
  .score-stamp{
    width:58px;height:58px;
    border-radius:50%;
    border:3px solid var(--red);
    color:var(--red);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Special Elite', monospace;
    transform:rotate(-7deg);
    flex-shrink:0;
  }
  .score-stamp .num{font-size:18px; font-weight:700; line-height:1;}
  .score-stamp .lbl{font-size:6px; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-family:'Special Elite', monospace;
    font-size:11px;
    color:var(--ink-soft);
    gap:8px;
    flex-wrap:wrap;
  }
  .highlight-tag{
    display:inline-block;
    padding:4px 10px;
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:12px;
    color:var(--ink);
    clip-path:polygon(1% 6%, 98% 0%, 100% 92%, 3% 100%);
    transform:rotate(-1.2deg);
  }
  .diff-tag{
    font-family:'Special Elite', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    border:1px solid var(--ink-soft);
    padding:3px 8px;
    border-radius:2px;
  }
  .streak-tag{
    color:var(--green);
    font-family:'Special Elite', monospace;
    letter-spacing:0.04em;
  }

  .timer-shell{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:18px;
    font-family:'Special Elite', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .timer-track{
    flex:1;
    height:9px;
    background:rgba(0,0,0,0.06);
    border:1px solid var(--ink-soft);
    border-radius:2px;
    overflow:hidden;
  }
  .timer-fill{
    height:100%;
    background:var(--blue);
    width:100%;
    transition:width 0.1s linear, background 0.3s;
  }
  .timer-fill.low{ background:var(--red); }

  .progress-dots{
    display:flex;
    gap:5px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .dot-lamp{
    width:15px;height:15px;
    border:1.5px solid var(--ink-soft);
    border-radius:3px;
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Special Elite', monospace;
    font-size:9px;
    color:transparent;
    background:transparent;
  }
  .dot-lamp.answered-correct{border-color:var(--green); color:var(--green); background:rgba(62,107,74,0.12);}
  .dot-lamp.answered-wrong{border-color:var(--red); color:var(--red); background:rgba(178,58,46,0.12);}
  .dot-lamp.current{border-color:var(--ink); background:var(--energy);}

  .question-box{
    border:2px dashed var(--ink);
    border-radius:3px;
    padding:20px 18px;
    min-height:70px;
    display:flex;
    align-items:center;
    margin-bottom:18px;
    transform:rotate(0.3deg);
    background:rgba(255,255,255,0.28);
    animation:card-in 0.25s ease;
  }
  @keyframes card-in{
    from{opacity:0; transform:translateY(5px) rotate(0.3deg);}
    to{opacity:1; transform:translateY(0) rotate(0.3deg);}
  }
  .question-text{
    font-size:16px;
    line-height:1.5;
    margin:0;
    font-weight:500;
  }

  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .console.device-phone .choices{grid-template-columns:1fr;}
  @media (max-width:420px){
    .console:not(.device-desktop):not(.device-tablet) .choices{grid-template-columns:1fr;}
  }
  .choice-btn{
    background:#FBF7E9;
    border:2px solid var(--ink);
    color:var(--ink);
    padding:12px 13px;
    border-radius:3px;
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
    text-align:left;
    cursor:pointer;
    transition:transform 0.08s, background 0.15s;
    display:flex;
    align-items:center;
    gap:9px;
    box-shadow:2px 2px 0 rgba(0,0,0,0.14);
    transform:rotate(var(--tilt, 0deg));
  }
  .choice-btn:hover:not(:disabled){
    background:#FFFDF3;
  }
  .choice-btn:active:not(:disabled){
    transform:scale(0.98) rotate(var(--tilt, 0deg));
  }
  .choice-btn:disabled{cursor:default;}
  .choice-letter{
    font-family:'Special Elite', monospace;
    font-weight:700;
    font-size:11px;
    width:20px;height:20px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .choice-btn.correct{
    border-color:var(--green);
    background:rgba(62,107,74,0.15);
  }
  .choice-btn.correct .choice-letter{border-color:var(--green); color:var(--green);}
  .choice-btn.wrong{
    border-color:var(--red);
    background:rgba(178,58,46,0.15);
    animation:shake 0.3s;
  }
  .choice-btn.wrong .choice-letter{border-color:var(--red); color:var(--red);}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(var(--tilt,0deg));}
    25%{transform:translateX(-3px) rotate(var(--tilt,0deg));}
    75%{transform:translateX(3px) rotate(var(--tilt,0deg));}
  }
  .choice-btn.faded{opacity:0.4;}

  .feedback-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:22px;
    margin-bottom:16px;
    font-family:'Special Elite', monospace;
    font-size:12px;
  }
  .feedback-msg{font-weight:700;}
  .feedback-msg.correct{color:var(--green); text-decoration:underline wavy var(--green);}
  .feedback-msg.wrong{color:var(--red); text-decoration:underline wavy var(--red);}
  .feedback-msg.timeout{color:var(--ink-soft);}

  .push-btn{
    width:100%;
    background:var(--ink);
    color:var(--board);
    border:none;
    border-bottom:4px solid #100E08;
    padding:13px;
    border-radius:4px;
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:transform 0.06s, border-bottom-width 0.06s;
  }
  .push-btn:hover{filter:brightness(1.15);}
  .push-btn:active{transform:translateY(3px); border-bottom-width:1px;}

  .center{text-align:center;}
  .lede{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
    max-width:420px;
    margin:0 auto 20px auto;
  }

  .device-pick{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    margin:22px 0 6px;
  }
  .device-card{
    width:126px;
    padding:16px 8px 12px;
    text-align:center;
    cursor:pointer;
    border:2px solid var(--ink);
    border-radius:4px;
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:13px;
    transition:transform 0.12s;
    box-shadow:2px 3px 0 rgba(0,0,0,0.15);
  }
  .device-card:hover{transform:translateY(-3px);}
  .device-card svg{display:block; margin:0 auto 8px auto;}

  .diff-select{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .sticky{
    padding:13px 14px;
    border:2px solid var(--ink);
    border-radius:2px;
    cursor:pointer;
    width:148px;
    text-align:left;
    box-shadow:2px 3px 0 rgba(0,0,0,0.15);
    transition:transform 0.1s;
    background:#FBF7E9;
  }
  .sticky:hover{transform:translateY(-2px);}
  .sticky.selected{background:var(--energy);}
  .sticky-name{
    font-family:'Special Elite', monospace;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin-bottom:4px;
  }
  .sticky-desc{
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.4;
  }

  .cat-legend{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
    margin-bottom:26px;
  }
  .legend-chip{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:12px;
    padding:4px 10px;
    clip-path:polygon(1% 8%, 98% 0%, 100% 90%, 2% 100%);
  }

  .buzz-btn{
    width:112px; height:112px;
    border-radius:50%;
    border:none;
    margin:8px auto 22px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:radial-gradient(circle at 36% 28%, #E15C4C, var(--red) 55%, #7A251B 100%);
    box-shadow:0 7px 0 #5C1B14, 0 12px 18px rgba(0,0,0,0.4);
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:16px;
    color:#FBF2EA;
    transition:transform 0.08s, box-shadow 0.08s;
  }
  .console.device-phone .buzz-btn{width:92px; height:92px; font-size:13px;}
  .console.device-desktop .buzz-btn{width:128px; height:128px; font-size:18px;}
  .buzz-btn:hover{filter:brightness(1.06);}
  .buzz-btn:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #5C1B14, 0 5px 10px rgba(0,0,0,0.4);
  }

  .link-btn{
    background:none; border:none; cursor:pointer;
    font-family:'Special Elite', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-decoration:underline;
    padding:4px;
    margin-bottom:14px;
  }

  .end-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    max-width:400px;
    margin:0 auto 24px auto;
  }
  .tile{
    border:2px solid var(--ink);
    border-radius:3px;
    padding:12px 6px;
    background:#FBF7E9;
    box-shadow:2px 2px 0 rgba(0,0,0,0.12);
  }
  .tile .stat-num{
    font-family:'Special Elite', monospace;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
  }
  .tile .stat-label{
    font-size:9px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-top:3px;
  }

  .breakdown{
    max-width:400px;
    margin:0 auto 24px auto;
    text-align:left;
    border:2px solid var(--ink);
    border-radius:3px;
    padding:4px 14px;
    background:rgba(255,255,255,0.3);
  }
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px dashed var(--ink-soft);
    font-family:'Special Elite', monospace;
    font-size:11px;
  }
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-cat{display:flex; align-items:center; gap:7px;}
  .breakdown-cat .swatch{width:9px;height:9px;border-radius:2px; border:1px solid var(--ink);}

  .signature-stamp{
    display:inline-block;
    font-family:'Permanent Marker', cursive;
    font-size:15px;
    color:var(--red);
    transform:rotate(-3deg);
    border:2px dashed var(--red);
    border-radius:9px;
    padding:6px 15px;
    margin-top:4px;
    opacity:0.85;
  }
  .fine-print{
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
    margin-top:10px;
    font-family:'Special Elite', monospace;
  }
</style>
</head>
<body>
<div class="console" id="app"></div>

<script>
const CATEGORIES = {
  Biology: 'bio', Chemistry: 'chem', Physics: 'phys',
  'Earth & Space': 'earth', Energy: 'energy', Math: 'math'
};

const DIFFICULTIES = {
  easy: {label:'Regional', desc:'Core facts and definitions — the level teams see at a regional meet.', time:14000},
  medium: {label:'Invitational', desc:'Multi-step recall and applied concepts, invitational pace.', time:10000},
  hard: {label:'Championship', desc:'Calculation-heavy, national-championship difficulty.', time:8000}
};

const QUESTIONS = [
  {cat:'Biology', diff:'easy', q:'Which organelle is primarily responsible for producing ATP through aerobic respiration?', choices:['Golgi apparatus','Mitochondrion','Ribosome','Lysosome'], answer:1},
  {cat:'Biology', diff:'easy', q:'What is the term for a change in the nucleotide sequence of DNA?', choices:['Mutation','Translation','Transcription','Replication'], answer:0},
  {cat:'Biology', diff:'easy', q:'Which blood type is known as the universal donor?', choices:['AB positive','O negative','A positive','B negative'], answer:1},
  {cat:'Biology', diff:'easy', q:'What process do plants use to convert light energy into chemical energy?', choices:['Respiration','Fermentation','Photosynthesis','Transpiration'], answer:2},
  {cat:'Biology', diff:'easy', q:'Which kingdom includes organisms like mushrooms and yeasts?', choices:['Plantae','Fungi','Protista','Monera'], answer:1},
  {cat:'Biology', diff:'medium', q:'What is the functional unit of the kidney called?', choices:['Neuron','Nephron','Alveolus','Villus'], answer:1},
  {cat:'Biology', diff:'medium', q:'DNA replication is described as semi-conservative because each new molecule contains what?', choices:['Two new strands','One old strand and one new strand','Two old strands','RNA and DNA strands'], answer:1},
  {cat:'Biology', diff:'medium', q:'Which macromolecule is primarily responsible for long-term energy storage in animals?', choices:['Protein','Nucleic acid','Carbohydrate','Fat'], answer:3},
  {cat:'Biology', diff:'medium', q:'What term describes two species evolving in response to each other over time?', choices:['Convergent evolution','Coevolution','Divergent evolution','Adaptive radiation'], answer:1},
  {cat:'Biology', diff:'medium', q:'Which phase of mitosis involves chromosomes lining up at the cell equator?', choices:['Prophase','Anaphase','Metaphase','Telophase'], answer:2},
  {cat:'Biology', diff:'hard', q:'During the light-independent reactions of photosynthesis, which enzyme catalyzes the initial fixation of carbon dioxide onto ribulose-1,5-bisphosphate?', choices:['ATP synthase','RuBisCO','DNA polymerase','Hexokinase'], answer:1},
  {cat:'Biology', diff:'hard', q:'In the electron transport chain, which complex is directly responsible for pumping protons while reducing ubiquinone using electrons from FADH2?', choices:['Complex I','Complex II','Complex III','Complex IV'], answer:1},
  {cat:'Biology', diff:'hard', q:'A cross between two heterozygous individuals for a gene showing incomplete dominance produces what phenotypic ratio in the offspring?', choices:['3:1','9:3:3:1','1:2:1','1:1:1:1'], answer:2},
  {cat:'Biology', diff:'hard', q:'Which type of RNA polymerase in eukaryotes is responsible for synthesizing messenger RNA?', choices:['RNA polymerase I','RNA polymerase II','RNA polymerase III','Primase'], answer:1},
  {cat:'Biology', diff:'hard', q:'The Hardy-Weinberg equation p squared plus 2pq plus q squared equals 1 assumes all of the following except which?', choices:['No mutation','Random mating','Infinite population size','Directional selection'], answer:3},
  {cat:'Biology', diff:'hard', q:'In competitive enzyme inhibition, which kinetic parameter changes while the other remains constant relative to the uninhibited reaction?', choices:['Vmax increases, Km unchanged','Km increases, Vmax unchanged','Both Vmax and Km decrease','Vmax decreases, Km unchanged'], answer:1},

  {cat:'Chemistry', diff:'easy', q:'What is the pH of a neutral solution at 25 degrees Celsius?', choices:['0','7','10','14'], answer:1},
  {cat:'Chemistry', diff:'easy', q:'Which subatomic particle has no electric charge?', choices:['Proton','Electron','Neutron','Positron'], answer:2},
  {cat:'Chemistry', diff:'easy', q:'What type of bond involves the sharing of electron pairs between atoms?', choices:['Ionic bond','Covalent bond','Metallic bond','Hydrogen bond'], answer:1},
  {cat:'Chemistry', diff:'easy', q:'What is the chemical symbol for gold?', choices:['Ag','Au','Gd','Go'], answer:1},
  {cat:'Chemistry', diff:'easy', q:'Avogadro\'s number represents the number of particles in what unit?', choices:['A gram','A liter','A mole','A molecule'], answer:2},
  {cat:'Chemistry', diff:'medium', q:'Which gas law states that pressure and volume are inversely related at constant temperature?', choices:['Charles\'s Law','Boyle\'s Law','Gay-Lussac\'s Law','Avogadro\'s Law'], answer:1},
  {cat:'Chemistry', diff:'medium', q:'What is the name for a substance that speeds up a reaction without being consumed?', choices:['Reactant','Catalyst','Product','Inhibitor'], answer:1},
  {cat:'Chemistry', diff:'medium', q:'In the periodic table, elements in the same column share what property?', choices:['Same atomic mass','Same number of valence electrons','Same number of neutrons','Same physical state'], answer:1},
  {cat:'Chemistry', diff:'medium', q:'What is the term for the smallest unit of an element that retains its chemical properties?', choices:['Molecule','Compound','Atom','Isotope'], answer:2},
  {cat:'Chemistry', diff:'medium', q:'Which type of reaction releases energy to the surroundings?', choices:['Endothermic','Exothermic','Isothermic','Adiabatic'], answer:1},
  {cat:'Chemistry', diff:'hard', q:'For a reaction with rate law rate = k[A]^2[B], if the concentration of A is doubled and B is tripled, by what factor does the rate increase?', choices:['6','8','12','24'], answer:2},
  {cat:'Chemistry', diff:'hard', q:'According to VSEPR theory, what is the molecular geometry of a molecule with 5 bonding pairs and 1 lone pair on the central atom?', choices:['Trigonal bipyramidal','Square pyramidal','Octahedral','Seesaw'], answer:1},
  {cat:'Chemistry', diff:'hard', q:'For the reaction N2 + 3H2 to 2NH3, if 2 moles of N2 react completely with excess H2, how many moles of NH3 are produced?', choices:['2','3','4','6'], answer:2},
  {cat:'Chemistry', diff:'hard', q:'A buffer solution is prepared using acetic acid, with a Ka of 1.8 times 10 to the negative 5, and sodium acetate in equal concentrations. What is the approximate pH of this buffer?', choices:['3.7','4.7','5.7','7.0'], answer:1},
  {cat:'Chemistry', diff:'hard', q:'In a galvanic cell, oxidation occurs at which electrode, and electrons flow in which direction through the external circuit?', choices:['Cathode; toward the anode','Anode; toward the cathode','Cathode; toward the cathode','Anode; toward the anode'], answer:1},

  {cat:'Physics', diff:'easy', q:'What is the SI unit of force?', choices:['Joule','Watt','Newton','Pascal'], answer:2},
  {cat:'Physics', diff:'easy', q:'According to Newton\'s third law, forces always occur in pairs that are equal and what?', choices:['In the same direction','Opposite in direction','Perpendicular','Random'], answer:1},
  {cat:'Physics', diff:'easy', q:'What quantity is measured in hertz?', choices:['Wavelength','Amplitude','Frequency','Period'], answer:2},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const ROUND_SIZE = 15;
const TILTS = ['-0.6deg','0.5deg','-0.4deg','0.8deg'];

let state = {
  phase: 'device',
  device: null,
  selectedDiff: 'hard',
  deck: [],
  index: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  results: [],
  answered: false,
  timeLimit: 8000,
  raf: null
};

function pickDevice(d){
  state.device = d;
  state.phase = 'start';
  render();
}

function pickDifficulty(d){
  state.selectedDiff = d;
  render();
}

function startGame(){
  const diff = state.selectedDiff;
  const pool = QUESTIONS.filter(q => q.diff === diff);
  state = Object.assign(state, {
    phase:'playing',
    selectedDiff: diff,
    deck: shuffle(pool).slice(0, ROUND_SIZE),
    index: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    results: [],
    answered: false,
    timeLimit: DIFFICULTIES[diff].time,
    raf: null
  });
  render();
  startTimer();
}

function startTimer(){
  clearTimer();
  state.timerStart = Date.now();
  const track = document.getElementById('timer-fill');
  const num = document.getElementById('timer-num');
  function tick(){
    const elapsed = Date.now() - state.timerStart;
    const pct = Math.max(0, 100 - (elapsed/state.timeLimit)*100);
    const secsLeft = Math.max(0, Math.ceil((state.timeLimit - elapsed)/1000));
    if(track) track.style.width = pct + '%';
    if(track) track.classList.toggle('low', pct < 25);
    if(num) num.textContent = secsLeft + 's';
    if(elapsed >= state.timeLimit && !state.answered){
      submitAnswer(-1);
      return;
    }
    if(!state.answered){
      state.raf = requestAnimationFrame(tick);
    }
  }
  state.raf = requestAnimationFrame(tick);
}

function clearTimer(){
  if(state.raf) cancelAnimationFrame(state.raf);
  state.raf = null;
}

function submitAnswer(choiceIdx){
  if(state.answered) return;
  state.answered = true;
  clearTimer();
  const q = state.deck[state.index];
  const correct = choiceIdx === q.answer;
  if(correct){
    state.score += 4;
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  } else {
    state.streak = 0;
  }
  state.results.push({cat:q.cat, correct, timedOut: choiceIdx === -1});
  render(choiceIdx);
}

function nextQuestion(){
  if(state.index + 1 >= state.deck.length){
    state.phase = 'end';
    render();
    return;
  }
  state.index += 1;
  state.answered = false;
  render();
  startTimer();
}

function goDevicePicker(){
  state.phase = 'device';
  render();
}

function render(selectedIdx){
  const app = document.getElementById('app');
  app.className = 'console' + (state.device ? ' device-' + state.device : '');

  let inner = '';
  if(state.phase === 'device'){
    inner = renderDevice();
  } else if(state.phase === 'start'){
    inner = renderStart();
  } else if(state.phase === 'end'){
    inner = renderEnd();
  } else {
    inner = renderPlaying(selectedIdx);
  }
  app.innerHTML = `<div class="clip"></div><div class="paper-sheet"><div class="team-tag">STM Sci Bowl</div>${inner}</div>`;

  if(state.phase === 'device'){
    document.querySelectorAll('.device-card').forEach(el=>{
      el.onclick = () => pickDevice(el.dataset.device);
    });
  } else if(state.phase === 'start'){
    document.getElementById('start-btn').onclick = startGame;
    document.querySelectorAll('.sticky').forEach(el=>{
      el.onclick = () => pickDifficulty(el.dataset.diff);
    });
    const sw = document.getElementById('switch-device');
    if(sw) sw.onclick = goDevicePicker;
  } else if(state.phase === 'end'){
    document.getElementById('restart-btn').onclick = () => { state.phase = 'start'; render(); };
    const sw = document.getElementById('switch-device');
    if(sw) sw.onclick = goDevicePicker;
  } else {
    if(!state.answered){
      document.querySelectorAll('.choice-btn').forEach((btn,i)=>{
        btn.onclick = () => submitAnswer(i);
      });
    } else {
      const nb = document.getElementById('next-btn');
      if(nb) nb.onclick = nextQuestion;
    }
  }
}

function renderDevice(){
  return `
    <div class="center">
      <p class="eyebrow">STM Science Bowl &middot; Practice Sheet</p>
      <p class="title-hand">What are you on?</p>
      <p class="lede">Pick your device and the practice sheet will resize to fit it properly.</p>
      <div class="device-pick">
        <div class="device-card" data-device="phone" style="background:var(--math); transform:rotate(-2deg);">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="var(--ink)" stroke-width="2"><rect x="9" y="3" width="12" height="24" rx="2"/><line x1="13" y1="24" x2="17" y2="24"/></svg>
          Phone
        </div>
        <div class="device-card" data-device="tablet" style="background:var(--phys); transform:rotate(1.5deg);">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="var(--ink)" stroke-width="2"><rect x="5" y="4" width="20" height="22" rx="2"/><line x1="13" y1="23" x2="17" y2="23"/></svg>
          Tablet
        </div>
        <div class="device-card" data-device="desktop" style="background:var(--energy); transform:rotate(-1deg);">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="var(--ink)" stroke-width="2"><rect x="3" y="5" width="24" height="16" rx="1.5"/><line x1="12" y1="25" x2="18" y2="25"/><line x1="15" y1="21" x2="15" y2="25"/></svg>
          Computer
        </div>
      </div>
    </div>
  `;
}

function renderStart(){
  const chips = Object.entries(CATEGORIES).map(([name,cls])=>
    `<span class="legend-chip" style="background:var(--${cls})">${name}</span>`
  ).join('');
  const diffOpts = Object.entries(DIFFICULTIES).map(([key,d])=>{
    const sel = key === state.selectedDiff ? ' selected' : '';
    return `<div class="sticky${sel}" data-diff="${key}">
      <div class="sticky-name">${d.label}</div>
      <div class="sticky-desc">${d.desc}</div>
    </div>`;
  }).join('');
  return `
    <div class="center">
      <p class="eyebrow">Made for the STM Science Bowl Team</p>
      <p class="title-hand">Science Bowl<br>Practice</p>
      <p class="lede">${ROUND_SIZE} toss-ups written in the style of a BPA Regional Science Bowl, covering Biology, Chemistry, Physics, Earth &amp; Space, Energy, and Math. Lock in an answer before the clock runs out — a correct call pays 4 points, and a miss resets your streak.</p>
      <div class="diff-select">${diffOpts}</div>
      <div class="cat-legend">${chips}</div>
      <button class="buzz-btn" id="start-btn">BUZZ<br>IN</button>
      <div><button class="link-btn" id="switch-device">wrong device? switch &#9656;</button></div>
      <div><span class="signature-stamp">coded by Kelly Chaney</span></div>
      <p class="fine-print">Built for the STM Science Bowl Team &middot; unofficial practice set, not affiliated with BPA</p>
    </div>
  `;
}

function renderPlaying(selectedIdx){
  const q = state.deck[state.index];
  const catClass = CATEGORIES[q.cat];
  const diffInfo = DIFFICULTIES[state.selectedDiff];
  const dots = state.deck.map((d,i)=>{
    let cls = 'dot-lamp';
    let mark = '';
    if(i < state.index){
      cls += state.results[i].correct ? ' answered-correct' : ' answered-wrong';
      mark = state.results[i].correct ? '&#10003;' : '&#215;';
    } else if(i === state.index){
      cls += ' current';
    }
    return `<div class="${cls}">${mark}</div>`;
  }).join('');

  let choicesHtml = '';
  q.choices.forEach((c,i)=>{
    let cls = 'choice-btn';
    let disabled = '';
    if(state.answered){
      disabled = 'disabled';
      if(i === q.answer) cls += ' correct';
      else if(i === selectedIdx) cls += ' wrong';
      else cls += ' faded';
    }
    choicesHtml += `<button class="${cls}" style="--tilt:${TILTS[i%TILTS.length]}" ${disabled}><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`;
  });

  let feedback = '';
  if(state.answered){
    const r = state.results[state.index];
    if(r.timedOut){
      feedback = `<span class="feedback-msg timeout">time's up — answer was ${String.fromCharCode(65+q.answer)}</span>`;
    } else if(r.correct){
      feedback = `<span class="feedback-msg correct">correct, +4</span>`;
    } else {
      feedback = `<span class="feedback-msg wrong">miss — answer was ${String.fromCharCode(65+q.answer)}</span>`;
    }
  } else {
    feedback = `<span></span>`;
  }

  const streakMark = state.streak <= 5
    ? '&#10003;'.repeat(state.streak)
    : '&#10003;&#10003;&#10003;&#10003;&#10003;+' + (state.streak - 5);

  return `
    <p class="eyebrow">STM Science Bowl &middot; BPA-style toss-up</p>
    <div class="header">
      <div>
        <p class="title-hand" style="font-size:24px;">Q${String(state.index+1).padStart(2,'0')} / ${state.deck.length}</p>
      </div>
      <div class="score-stamp">
        <span class="num">${state.score}</span>
        <span class="lbl">score</span>
      </div>
    </div>
    <div class="progress-dots">${dots}</div>
    <div class="meta-row">
      <span class="highlight-tag" style="background:var(--${catClass})">${q.cat}</span>
      <span class="diff-tag">${diffInfo.label}</span>
      <span class="streak-tag">${state.streak > 0 ? streakMark : 'streak: 0'}</span>
    </div>
    <div class="timer-shell">
      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
      <span class="timer-num" id="timer-num">${Math.round(state.timeLimit/1000)}s</span>
    </div>
    <div class="question-box">
      <p class="question-text">${q.q}</p>
    </div>
    <div class="choices">${choicesHtml}</div>
    <div class="feedback-row">${feedback}<span></span></div>
    ${state.answered ? `<button class="push-btn" id="next-btn">${state.index+1 >= state.deck.length ? 'see final score' : 'next toss-up'}</button>` : ''}
  `;
}

function renderEnd(){
  const total = state.deck.length;
  const correctCount = state.results.filter(r=>r.correct).length;
  const accuracy = Math.round((correctCount/total)*100);

  const byCat = {};
  state.results.forEach((r,i)=>{
    const cat = state.deck[i].cat;
    if(!byCat[cat]) byCat[cat] = {correct:0,total:0};
    byCat[cat].total += 1;
    if(r.correct) byCat[cat].correct += 1;
  });

  const rows = Object.entries(byCat).map(([cat,v])=>{
    const cls = CATEGORIES[cat];
    return `<div class="breakdown-row">
      <span class="breakdown-cat"><span class="swatch" style="background:var(--${cls})"></span>${cat}</span>
      <span>${v.correct} / ${v.total}</span>
    </div>`;
  }).join('');

  return `
    <div class="center">
      <p class="eyebrow">Round Complete &middot; ${DIFFICULTIES[state.selectedDiff].label}</p>
      <p class="title-hand" style="font-size:46px;">${state.score} pts</p>
      <p class="lede">${correctCount} of ${total} correct at ${accuracy}% accuracy. Best streak: ${state.bestStreak}.</p>
      <div class="end-stats">
        <div class="tile"><div class="stat-num">${correctCount}</div><div class="stat-label">Correct</div></div>
        <div class="tile"><div class="stat-num">${state.score}</div><div class="stat-label">Points</div></div>
        <div class="tile"><div class="stat-num">${state.bestStreak}</div><div class="stat-label">Best streak</div></div>
      </div>
      <div class="breakdown">${rows}</div>
      <button class="buzz-btn" id="restart-btn" style="font-size:13px;">NEW<br>ROUND</button>
      <div><button class="link-btn" id="switch-device">wrong device? switch &#9656;</button></div>
      <div><span class="signature-stamp">coded by Kelly Chaney</span></div>
      <p class="fine-print">Built for the STM Science Bowl Team &middot; unofficial practice set</p>
    </div>
  `;
}

render();
</script>
